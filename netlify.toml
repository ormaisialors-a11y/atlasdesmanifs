# Configuration Netlify de l'Atlas des manifs
[build]
  command = "node build.js"
  publish = "."
  functions = "netlify/functions"
  # Netlify ne se republie PAS quand seuls le contenu, les photos ou les réglages
  # de modération changent : le site les lit directement sur GitHub.
  # Il se republie uniquement quand le code ou le design changent (index.html, app.js…).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)contenu' ':(exclude)photos' ':(exclude)data.json' ':(exclude)data.js' ':(exclude)moderation.json' ':(exclude)README.md'"
